<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>皮卡丘文字接接樂</title>
    <!-- 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #f1c40f;
            --secondary-color: #3498db;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --bg-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            font-family: "Klee One", "BiauKai", "標楷體", serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            box-shadow: var(--shadow);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
        }

        /* Shake Effect for wrong hit */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        /* UI Screens */
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 10;
            transition: opacity 0.3s;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        /* Typography & Components */
        h1 {
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 0 4px 0 #2c3e50, 0 8px 10px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.2;
        }

        .panel {
            background: var(--glass-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 90%;
            max-width: 500px;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
            color: #2c3e50;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            margin: 10px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            font-family: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
        }

        .btn-primary { background: var(--primary-color); color: #2c3e50; }
        .btn-secondary { background: var(--secondary-color); color: white; }
        .btn-green { background: var(--success-color); color: white; }

        /* Custom Radio Buttons */
        .selector-group {
            background: rgba(255,255,255,0.5);
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            width: 100%;
            box-sizing: border-box;
        }
        
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        .radio-label {
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: all 0.2s;
            display: inline-block;
        }
        
        input[type="radio"]:checked + .radio-label {
            background: var(--primary-color);
            border-color: #d35400;
            color: #d35400;
            font-weight: bold;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* In-Game HUD */
        #game-ui {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .hud-item {
            position: absolute;
            font-weight: bold;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            color: #2c3e50;
        }

        #score-board { top: 15px; left: 15px; font-size: 1.5rem; }
        #timer-board { top: 50px; left: 15px; font-size: 1.2rem; color: var(--danger-color); }

        #target-display {
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            padding: 8px 25px;
            border-radius: 30px;
            border: 4px solid var(--primary-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            pointer-events: auto;
            min-width: 120px;
        }
        
        #current-target-char {
            font-size: 2rem;
            color: var(--danger-color);
            font-weight: bold;
            display: inline-block;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Pause Button */
        #pause-btn {
            position: absolute;
            top: 15px; right: 15px;
            width: 45px; height: 45px;
            background: var(--danger-color);
            border: 3px solid white;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 20;
        }

        /* Toast Message */
        #toast-message {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(46, 204, 113, 0.95);
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 2rem;
            font-weight: bold;
            z-index: 100;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        
        .toast-visible {
            opacity: 1 !important;
            transform: translate(-50%, -50%) scale(1) !important;
        }

        /* Input Styles */
        textarea, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        
        textarea:focus, input:focus {
            border-color: var(--secondary-color);
            outline: none;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            margin: 2px;
            font-size: 0.9em;
        }
        .tag-target { background: var(--primary-color); color: #333; }
        .tag-distractor { background: #ecf0f1; color: #7f8c8d; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            #target-display { padding: 5px 15px; }
            #current-target-char { font-size: 1.5rem; }
            .btn { padding: 10px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="game-ui">
        <div id="score-board" class="hud-item">分數: 0</div>
        <div id="timer-board" class="hud-item">時間: 60</div>
        
        <div id="target-display" class="hud-item">
            <div style="font-size: 0.9rem; color:#555;">請接住</div>
            <div id="current-target-char">?</div>
            <div id="level-progress" style="font-size: 0.8rem; color:#666; margin-top:2px;">進度: 0/5</div>
        </div>
        
        <div id="pause-btn" onclick="Game.togglePause()">||</div>
        <div id="toast-message">太棒了！</div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="ui-screen">
        <div style="text-align: center;">
            <div style="font-size: 4rem; margin-bottom: -10px;">⚡</div>
            <h1>皮卡丘<br>文字接接樂</h1>
        </div>
        
        <div class="panel" style="background: rgba(255,255,255,0.9);">
            <button class="btn btn-primary" onclick="Game.showTeacherPanel()">我是老師 (設定題目)</button>
            <button class="btn btn-secondary" onclick="Game.showSetupScreen(false)">開始遊戲</button>
            <div style="margin-top: 15px; font-size: 0.9rem; color: #555;">
                💻 電腦：左右方向鍵移動<br>
                📱 手機：按住螢幕滑動
            </div>
        </div>
    </div>

    <!-- Setup Screen -->
    <div id="setup-screen" class="ui-screen hidden">
        <div class="panel">
            <h2>準備開始</h2>
            <div id="teacher-msg" style="display:none; color: var(--primary-color); margin-bottom: 10px;">
                ★ 老師已經設定好題目囉！
            </div>
            
            <div class="selector-group">
                <div style="margin-bottom:10px; font-weight:bold; color:#666;">選擇角色</div>
                <div class="radio-group">
                    <!-- Emojis as character icons -->
                    <label><input type="radio" name="setup-char-select" value="pikachu" checked> <span class="radio-label">⚡ 皮卡丘</span></label>
                    <label><input type="radio" name="setup-char-select" value="superman"> <span class="radio-label">🦸‍♂️ 超人</span></label>
                    <label><input type="radio" name="setup-char-select" value="princess"> <span class="radio-label">👸 公主</span></label>
                    <label><input type="radio" name="setup-char-select" value="ninja"> <span class="radio-label">🥷 忍者</span></label>
                    <label><input type="radio" name="setup-char-select" value="robot"> <span class="radio-label">🤖 機器人</span></label>
                </div>
            </div>

            <div class="selector-group">
                <div style="margin-bottom:10px; font-weight:bold; color:#666;">難度</div>
                <div class="radio-group">
                    <label><input type="radio" name="setup-diff-select" value="easy"> <span class="radio-label">簡單</span></label>
                    <label><input type="radio" name="setup-diff-select" value="medium" checked> <span class="radio-label">普通</span></label>
                    <label><input type="radio" name="setup-diff-select" value="hard"> <span class="radio-label">困難</span></label>
                </div>
            </div>

            <button class="btn btn-green" style="width:80%; font-size: 1.4rem;" onclick="Game.startFromSetup()">GO! 出發</button>
            <br>
            <button class="btn btn-secondary" style="font-size: 0.9rem; padding: 5px 15px; margin-top:5px;" onclick="Game.showMenu()">回選單</button>
        </div>
    </div>

    <!-- Teacher Panel -->
    <div id="teacher-screen" class="ui-screen hidden">
        <div class="panel">
            <h2>📝 題目設定</h2>
            
            <div style="text-align: left;">
                <label>遊戲時間 (秒):</label>
                <input type="number" id="time-input" value="60" min="10" max="300">
                
                <label>練習文字 (連在一起輸入):</label>
                <textarea id="target-input" rows="3" placeholder="例如：愛我人日月星" oninput="Game.updateDistractorsPreview()">愛我人</textarea>
                
                <div style="font-size:0.9rem; color:#666;">預覽 (AI 自動生成混淆字):</div>
                <div id="distractor-container" style="background:#f9f9f9; padding:10px; border-radius:8px; min-height:40px; margin-bottom:10px;"></div>
            </div>

            <button class="btn btn-primary" onclick="Game.saveSettings()">直接開始</button>
            <button class="btn btn-green" onclick="Game.generateShareLink()">產生分享連結</button>
            
            <div id="share-section" style="display:none; margin-top:15px; padding-top:15px; border-top:1px dashed #ccc;">
                <p style="margin:0 0 5px 0;">複製連結給學生：</p>
                <input type="text" id="share-link-box" readonly onclick="this.select()">
            </div>
            
            <button class="btn btn-secondary" onclick="Game.showMenu()">返回</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="ui-screen hidden">
        <div class="panel">
            <h1 style="color:#2c3e50; font-size:2.5rem; text-shadow:none; margin-bottom:10px;">時間到！</h1>
            <h2 id="final-score" style="color:var(--danger-color); font-size:3rem; margin:10px 0;">得分: 0</h2>
            <p id="final-comment" style="color:#666;">還不錯喔！</p>
            <button class="btn btn-primary" onclick="Game.restart()">再玩一次</button>
            <button class="btn btn-secondary" onclick="Game.showMenu()">回主選單</button>
        </div>
    </div>
    
    <!-- Pause Overlay -->
    <div id="pause-overlay" class="ui-screen hidden" style="background: rgba(0,0,0,0.3);">
        <h1 style="font-size: 5rem;">暫停</h1>
        <button class="btn btn-primary" onclick="Game.togglePause()">繼續遊戲</button>
    </div>
</div>

<script>
/**
 * 簡易音效控制器 (Web Audio API) - 無需外部文件
 */
const AudioController = {
    ctx: null,
    init() {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
    },
    playTone(freq, type, duration) {
        if (!this.ctx) this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    playGood() {
        this.playTone(600, 'sine', 0.1);
        setTimeout(() => this.playTone(800, 'sine', 0.2), 100);
    },
    playBad() {
        this.playTone(150, 'sawtooth', 0.3);
    },
    playLevelUp() {
        this.playTone(400, 'square', 0.1);
        setTimeout(() => this.playTone(600, 'square', 0.1), 100);
        setTimeout(() => this.playTone(800, 'square', 0.1), 200);
        setTimeout(() => this.playTone(1200, 'square', 0.4), 300);
    }
};

/**
 * 易混淆字資料庫
 */
const CONFUSING_DB = {
    '人': ['入', '八', '乂', '大', '个'],
    '入': ['人', '八', '乂'],
    '大': ['太', '犬', '夫', '天', '人'],
    '太': ['大', '犬', '夫', '天'],
    '天': ['夫', '大', '太', '夭', '未'],
    '夫': ['天', '大', '太', '夭', '未'],
    '土': ['士', '工', '上', '止', '干'],
    '士': ['土', '工', '上', '壬', '王'],
    '王': ['玉', '主', '土', '干', '五'],
    '玉': ['王', '主', '宝', '玊'],
    '主': ['王', '玉', '注', '住'],
    '田': ['由', '甲', '申', '旦', '日'],
    '由': ['田', '甲', '申', '曲'],
    '甲': ['田', '由', '申'],
    '日': ['曰', '目', '田', '白', '旦'],
    '目': ['日', '且', '自', '白', '貝'],
    '白': ['自', '百', '日', '臼', '伯'],
    '自': ['白', '目', '百', '首'],
    '木': ['本', '禾', '术', '林', '未'],
    '本': ['木', '禾', '术', '体', '来'],
    '禾': ['木', '本', '季', '米'],
    '我': ['找', '錢', '淺', '俄', '娥'],
    '找': ['我', '划', '戏', '伐', '栈'],
    '愛': ['受', '暖', '憂', '慶', '曼'],
    '受': ['愛', '爱', '叟'],
    '右': ['石', '左', '古', '若', '友'],
    '左': ['右', '在', '友', '存', '工'],
    '石': ['右', '古', '若', '宕'],
    '很': ['根', '銀', '狠', '恨', '限'],
    '根': ['很', '銀', '狠', '恨', '跟'],
    '鳥': ['烏', '馬', '島', '焉', '梟'],
    '烏': ['鳥', '馬', '焉', '黑', '嗚'],
    '午': ['牛', '干', '千', '乍', '年'],
    '牛': ['午', '半', '手', '生', '车'],
    '手': ['毛', '牛', '乎', '于', '才'],
    '水': ['氷', '永', '木', '火', '求'],
    '買': ['賣', '貝', '具', '實'],
    '賣': ['買', '讀', '續'],
    '晴': ['睛', '情', '請', '清', '精'],
    '睛': ['晴', '情', '請', '清'],
    '情': ['晴', '睛', '請', '清', '惜'],
    '請': ['情', '晴', '睛', '清'],
    '清': ['情', '晴', '睛', '請', '青']
};

const COMMON_CHARS = "的一是在不了有和人這中大為上個國我向要他時來用們生到作地於出就分對成會可主發年動同工也能下過子說產種面而方後多定行學法所民得經十三之進著等部度家更完樣今育提求治以流現五內聖";

// Character Emoji Map
const CHAR_EMOJIS = {
    'pikachu': '⚡',
    'superman': '🦸‍♂️',
    'princess': '👸',
    'ninja': '🥷',
    'robot': '🤖'
};

const DIFFICULTY_SETTINGS = {
    'easy': { speedMod: 1.5, score: 10, spawnRate: 60 },
    'medium': { speedMod: 2.5, score: 20, spawnRate: 50 },
    'hard': { speedMod: 4.0, score: 30, spawnRate: 35 }
};

const Game = {
    canvas: document.getElementById('gameCanvas'),
    ctx: null,
    width: 0,
    height: 0,
    state: 'start', 
    paused: false,
    score: 0,
    
    // Config
    gameDuration: 60,
    remainingTime: 60,
    lastTime: 0,
    currentDifficulty: 'medium',
    playerCharKey: 'pikachu',

    // Level System
    targetList: ['愛', '我', '人'],
    currentTargetIndex: 0,
    targetChar: '愛',
    distractors: [],
    levelProgress: 0,
    HITS_TO_ADVANCE: 5,
    
    // Game Entities
    player: { x: 0, y: 0, width: 70, height: 70, speed: 8 },
    enemies: [], // Falling words
    particles: [], // Effects
    floatTexts: [], // +10, -5
    
    // Input
    keys: { ArrowLeft: false, ArrowRight: false },
    touchX: null,
    
    // Loop
    animationFrameId: null,
    spawnTimer: 0,

    init() {
        this.ctx = this.canvas.getContext('2d');
        
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') this.togglePause();
            this.keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => this.keys[e.key] = false);
        
        // Touch Controls
        const handleTouch = (e) => {
            if(this.state !== 'playing' || this.paused) return;
            e.preventDefault(); // Prevent scroll
            const rect = this.canvas.getBoundingClientRect();
            const touch = e.touches[0];
            let targetX = touch.clientX - rect.left - this.player.width / 2;
            
            // Direct position mapping for better control
            this.player.x = Math.max(0, Math.min(this.width - this.player.width, targetX));
        };

        this.canvas.addEventListener('touchstart', (e) => {
            if(this.state === 'playing') AudioController.init(); // Init audio on first touch
            handleTouch(e);
        }, {passive: false});
        this.canvas.addEventListener('touchmove', handleTouch, {passive: false});
        
        // Check URL for shared config
        const isShared = this.checkURLParams();
        this.updateDistractorsPreview();
        
        if (isShared) {
            this.showSetupScreen(true);
        } else {
            this.showMenu();
        }
        
        // Start Loop
        requestAnimationFrame((t) => this.loop(t));
    },
    
    checkURLParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const sharedWords = urlParams.get('words');
        const sharedTime = urlParams.get('time');
        
        if (sharedWords) {
            try {
                const decoded = decodeURIComponent(sharedWords);
                if (decoded.length > 0) {
                    this.targetList = decoded.split('');
                    if (sharedTime) this.gameDuration = parseInt(sharedTime) || 60;
                    document.getElementById('target-input').value = this.targetList.join('');
                    document.getElementById('time-input').value = this.gameDuration;
                    return true;
                }
            } catch(e) { console.error(e); }
        }
        return false;
    },

    resize() {
        this.width = Math.min(window.innerWidth, 600); 
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        if (this.player) {
            this.player.y = this.height - 110; // Position from bottom
            // Keep player inside screen on resize
            if(this.player.x > this.width - this.player.width) this.player.x = this.width - this.player.width;
        }
    },

    generateDistractors(target) {
        let similar = CONFUSING_DB[target];
        let result = [];
        if (similar) result = [...similar];
        
        while (result.length < 5) {
            const keys = Object.keys(CONFUSING_DB);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            const randomConfusing = CONFUSING_DB[randomKey] ? CONFUSING_DB[randomKey][0] : '無';
            
            let charToAdd = randomConfusing;
            if (Math.random() > 0.6) {
                charToAdd = COMMON_CHARS[Math.floor(Math.random() * COMMON_CHARS.length)];
            }

            if (charToAdd !== target && !result.includes(charToAdd)) {
                result.push(charToAdd);
            }
        }
        return result.sort(() => Math.random() - 0.5).slice(0, 5);
    },

    // --- UI Navigation ---
    showMenu() {
        this.state = 'start';
        this.toggleUIScreens('start-screen');
    },
    
    showSetupScreen(isStudent) {
        this.state = 'setup';
        this.toggleUIScreens('setup-screen');
        document.getElementById('teacher-msg').style.display = isStudent ? 'block' : 'none';
        AudioController.init();
    },

    showTeacherPanel() {
        this.state = 'setup';
        this.toggleUIScreens('teacher-screen');
        document.getElementById('share-section').style.display = 'none';
        this.updateDistractorsPreview();
    },
    
    toggleUIScreens(activeId) {
        ['start-screen', 'setup-screen', 'teacher-screen', 'game-over-screen', 'pause-overlay'].forEach(id => {
            const el = document.getElementById(id);
            if (id === activeId) el.classList.remove('hidden');
            else el.classList.add('hidden');
        });
        document.getElementById('game-ui').style.opacity = (activeId === '' || activeId === 'pause-overlay') ? 1 : 0;
    },
    
    // --- Teacher Functions ---
    updateDistractorsPreview() {
        const input = document.getElementById('target-input').value.replace(/\s/g, '');
        const container = document.getElementById('distractor-container');
        if (!input) {
            container.innerHTML = '請輸入文字...';
            return;
        }
        
        let html = '';
        const chars = input.split('').filter((item, pos, self) => self.indexOf(item) == pos);
        chars.forEach(c => {
            html += `<span class="tag tag-target">${c}</span>`;
            const distractors = this.generateDistractors(c).slice(0, 3);
            distractors.forEach(d => html += `<span class="tag tag-distractor">${d}</span>`);
            html += '<br>';
        });
        container.innerHTML = html;
    },
    
    generateShareLink() {
        const input = document.getElementById('target-input').value.trim();
        const timeInput = parseInt(document.getElementById('time-input').value);
        if (!input) { alert("請先輸入題目！"); return; }
        
        const cleanInput = input.replace(/\s/g, '');
        const baseUrl = window.location.href.split('?')[0];
        const newUrl = `${baseUrl}?words=${encodeURIComponent(cleanInput)}&time=${timeInput}`;
        
        document.getElementById('share-section').style.display = 'block';
        document.getElementById('share-link-box').value = newUrl;
    },
    
    saveSettings() {
        const input = document.getElementById('target-input').value.trim();
        const timeInput = parseInt(document.getElementById('time-input').value);
        if (input) {
            this.targetList = input.replace(/\s/g, '').split('');
            this.gameDuration = timeInput;
            this.showSetupScreen(false);
        }
    },

    // --- Game Logic ---
    getSelectedOptions() {
        document.getElementsByName('setup-diff-select').forEach(r => { if(r.checked) this.currentDifficulty = r.value; });
        document.getElementsByName('setup-char-select').forEach(r => { if(r.checked) this.playerCharKey = r.value; });
    },
    
    startFromSetup() {
        this.getSelectedOptions();
        this.startGame();
    },
    
    restart() {
        this.startGame();
    },

    startGame() {
        AudioController.init();
        this.score = 0;
        const settings = DIFFICULTY_SETTINGS[this.currentDifficulty];
        
        this.remainingTime = this.gameDuration;
        this.enemies = [];
        this.particles = [];
        this.floatTexts = [];
        this.paused = false;
        this.spawnTimer = 0;
        
        // Reset Level
        if (this.targetList.length === 0) this.targetList = ['愛', '我', '人'];
        this.currentTargetIndex = 0;
        this.levelProgress = 0;
        this.setTarget(this.targetList[0]);
        
        // Reset Player
        this.player.x = this.width / 2 - this.player.width / 2;
        
        // UI
        this.toggleUIScreens('');
        this.updateHUD();
        
        this.lastTime = performance.now();
        this.state = 'playing';
        this.announceTarget();
    },

    setTarget(char) {
        this.targetChar = char;
        this.distractors = this.generateDistractors(char);
        document.getElementById('current-target-char').innerText = this.targetChar;
        document.getElementById('level-progress').innerText = `進度: ${this.levelProgress}/${this.HITS_TO_ADVANCE}`;
    },

    togglePause() {
        if(this.state !== 'playing') return;
        this.paused = !this.paused;
        if(this.paused) {
            this.toggleUIScreens('pause-overlay');
        } else {
            this.toggleUIScreens('');
            this.lastTime = performance.now();
            this.announceTarget();
        }
    },

    announceTarget() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(this.targetChar);
            u.lang = 'zh-TW';
            u.rate = 0.8;
            window.speechSynthesis.speak(u);
        }
    },

    update(dt) {
        // Timer
        if (this.remainingTime > 0) {
            this.remainingTime -= dt / 1000;
            if (this.remainingTime <= 0) {
                this.remainingTime = 0;
                this.gameOver();
                return;
            }
        }

        // Player Movement (Keyboard)
        if (this.keys.ArrowLeft) this.player.x -= this.player.speed;
        if (this.keys.ArrowRight) this.player.x += this.player.speed;
        
        // Boundaries
        if (this.player.x < 0) this.player.x = 0;
        if (this.player.x > this.width - this.player.width) this.player.x = this.width - this.player.width;

        // Spawning Enemies
        this.spawnTimer++;
        const diff = DIFFICULTY_SETTINGS[this.currentDifficulty];
        if (this.spawnTimer > diff.spawnRate) {
            this.spawnEnemy();
            this.spawnTimer = 0;
        }

        // Update Enemies
        for (let i = this.enemies.length - 1; i >= 0; i--) {
            let e = this.enemies[i];
            e.y += e.speed;

            // Collision
            if (e.y + e.height > this.player.y + 10 && 
                e.y < this.player.y + this.player.height - 10 &&
                e.x + e.width > this.player.x + 10 && 
                e.x < this.player.x + this.player.width - 10) {
                
                this.handleCollision(e);
                this.enemies.splice(i, 1);
                continue;
            }

            // Remove if off screen
            if (e.y > this.height) {
                this.enemies.splice(i, 1);
            }
        }

        // Update Particles
        this.particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.02;
        });
        this.particles = this.particles.filter(p => p.alpha > 0);

        // Update Floating Texts
        this.floatTexts.forEach(ft => {
            ft.y -= 1;
            ft.life--;
        });
        this.floatTexts = this.floatTexts.filter(ft => ft.life > 0);

        this.updateHUD();
    },

    handleCollision(e) {
        if (e.isCorrect) {
            // Correct
            const points = DIFFICULTY_SETTINGS[this.currentDifficulty].score;
            this.score += points;
            this.levelProgress++;
            AudioController.playGood();
            this.createExplosion(this.player.x + this.player.width/2, this.player.y, '#f1c40f');
            this.addFloatText(`+${points}`, this.player.x, this.player.y, '#2ecc71');
            
            if (this.levelProgress >= this.HITS_TO_ADVANCE) {
                this.levelUp();
            }
        } else {
            // Wrong
            this.score = Math.max(0, this.score - 5);
            AudioController.playBad();
            this.addFloatText("-5", this.player.x, this.player.y, '#e74c3c');
            
            // Screen Shake
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 500);
        }
    },

    levelUp() {
        this.showToast("下一關！");
        AudioController.playLevelUp();
        
        this.currentTargetIndex = (this.currentTargetIndex + 1) % this.targetList.length;
        this.levelProgress = 0;
        this.setTarget(this.targetList[this.currentTargetIndex]);
        this.enemies = []; // Clear screen
        this.announceTarget();
    },

    spawnEnemy() {
        const x = Math.random() * (this.width - 60);
        const isCorrect = Math.random() > 0.6; // 40% chance for target
        
        let char = this.targetChar;
        if (!isCorrect) {
            char = this.distractors[Math.floor(Math.random() * this.distractors.length)];
        }

        const diff = DIFFICULTY_SETTINGS[this.currentDifficulty];
        this.enemies.push({
            x: x,
            y: -60,
            width: 50,
            height: 50,
            char: char,
            isCorrect: isCorrect,
            speed: (Math.random() * 2 + 2) * (diff.speedMod * 0.6), // Speed tuning
            color: isCorrect ? '#2c3e50' : '#555'
        });
    },

    createExplosion(x, y, color) {
        for(let i=0; i<15; i++) {
            this.particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                color: color,
                alpha: 1,
                size: Math.random() * 5 + 2
            });
        }
    },
    
    addFloatText(text, x, y, color) {
        this.floatTexts.push({
            text: text,
            x: x + 20,
            y: y,
            color: color,
            life: 60
        });
    },

    showToast(msg) {
        const t = document.getElementById('toast-message');
        t.innerText = msg;
        t.classList.add('toast-visible');
        setTimeout(() => t.classList.remove('toast-visible'), 1500);
    },

    updateHUD() {
        document.getElementById('score-board').innerText = `分數: ${this.score}`;
        document.getElementById('timer-board').innerText = `時間: ${Math.ceil(this.remainingTime)}`;
    },

    draw() {
        // Clear
        this.ctx.clearRect(0, 0, this.width, this.height);

        // Draw Player (Emoji)
        this.ctx.font = "60px Arial";
        this.ctx.textAlign = "center";
        this.ctx.textBaseline = "middle";
        const emoji = CHAR_EMOJIS[this.playerCharKey] || '⚡';
        this.ctx.fillText(emoji, this.player.x + this.player.width/2, this.player.y + this.player.height/2);

        // Draw Enemies (Text bubbles)
        this.enemies.forEach(e => {
            // Bubble
            this.ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            this.ctx.beginPath();
            this.ctx.arc(e.x + e.width/2, e.y + e.height/2, 30, 0, Math.PI*2);
            this.ctx.fill();
            
            // Text
            this.ctx.fillStyle = e.isCorrect ? "#d35400" : "#7f8c8d";
            this.ctx.font = "bold 32px 'Klee One', serif";
            this.ctx.fillText(e.char, e.x + e.width/2, e.y + e.height/2 + 2); // +2 for visual centering
        });

        // Draw Particles
        this.particles.forEach(p => {
            this.ctx.globalAlpha = p.alpha;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.globalAlpha = 1;
        });
        
        // Draw Float Text
        this.floatTexts.forEach(ft => {
            this.ctx.fillStyle = ft.color;
            this.ctx.font = "bold 24px Arial";
            this.ctx.fillText(ft.text, ft.x, ft.y);
        });
    },

    loop(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp;
        const dt = timestamp - this.lastTime;
        
        if (this.state === 'playing' && !this.paused) {
            this.update(dt);
            this.draw();
        }
        
        this.lastTime = timestamp;
        requestAnimationFrame((t) => this.loop(t));
    },
    
    gameOver() {
        this.state = 'gameover';
        document.getElementById('final-score').innerText = `得分: ${this.score}`;
        
        let comment = "再接再厲！";
        if(this.score > 50) comment = "不錯喔！";
        if(this.score > 100) comment = "太厲害了！";
        if(this.score > 200) comment = "神級表現！";
        document.getElementById('final-comment').innerText = comment;
        
        this.toggleUIScreens('game-over-screen');
    }
};

// Start
window.onload = () => Game.init();

</script>
