<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>皮卡丘文字接接樂</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            /* 字體設定：標楷體 */
            font-family: "BiauKai", "標楷體", serif; 
            overflow: hidden;
            touch-action: none;
            color: white;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #74ebd5, #ACB6E5);
        }

        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.1);
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated; /* 讓像素圖保持清晰 */
        }

        /* UI Overlay Styles */
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            transition: opacity 0.3s;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 3rem;
            color: #f1c40f;
            text-shadow: 4px 4px #c0392b;
            margin-bottom: 20px;
            text-align: center;
            font-family: 'Courier New', "BiauKai", monospace; /* 復古感 */
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            margin: 10px;
            border: 4px solid rgba(0,0,0,0.2);
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.1s;
            font-weight: bold;
            font-family: "BiauKai", "標楷體", serif;
        }

        .btn-primary {
            background-color: #f1c40f;
            color: #2c3e50;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background-color: #3498db;
            color: white;
        }
        
        .btn-green {
            background-color: #2ecc71;
            color: white;
        }

        /* Pause Button */
        #pause-btn {
            position: absolute;
            top: 10px;
            right: 10px; /* Moves target display slightly */
            width: 50px;
            height: 50px;
            background: #e74c3c;
            border: 3px solid white;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            pointer-events: auto;
            box-shadow: 0 4px 0 #c0392b;
        }
        
        #pause-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .panel {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        textarea {
            padding: 10px;
            font-size: 1.2rem;
            width: 90%;
            height: 60px;
            text-align: left;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-bottom: 10px;
            resize: none;
            font-family: "BiauKai", "標楷體", serif;
        }

        input[type="number"] {
            padding: 5px;
            font-size: 1.2rem;
            width: 80px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-family: "BiauKai", "標楷體", serif;
        }

        /* QR Code Section */
        #share-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #eee;
            display: none; 
        }
        
        #qr-code-img {
            margin: 10px auto;
            border: 5px solid white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 150px;
            display: block;
        }
        
        #share-link-box {
            width: 90%;
            font-size: 0.8rem;
            padding: 5px;
            margin-top: 5px;
            color: #555;
            background: #f0f0f0;
            border: 1px solid #ccc;
            word-break: break-all;
        }

        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        #score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 1.5rem;
            color: #2c3e50;
            font-weight: bold;
            text-shadow: 1px 1px 0px white;
        }

        #timer-board {
            position: absolute;
            top: 45px;
            left: 10px;
            font-size: 1.2rem;
            color: #e74c3c;
            font-weight: bold;
            text-shadow: 1px 1px 0px white;
        }

        #target-display {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: #333;
            background: rgba(255,255,255,0.9);
            padding: 5px 20px;
            border-radius: 20px;
            border: 3px solid #f1c40f;
            pointer-events: auto;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            text-align: center;
        }

        #level-progress {
            font-size: 0.8rem;
            color: #666;
            margin-top: 2px;
        }

        #toast-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(46, 204, 113, 0.95);
            color: white;
            padding: 30px 50px;
            border-radius: 50px;
            font-size: 2.5rem;
            font-weight: bold;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            white-space: nowrap;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .toast-visible {
            opacity: 1 !important;
            animation: bounce 0.5s ease-out;
        }

        @keyframes bounce {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .mobile-hint {
            margin-top: 20px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .distractor-preview {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .distractor-tag {
            background: #eee;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            margin: 2px;
        }
        
        .target-tag {
            background: #f1c40f;
            color: #2c3e50;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin: 2px;
        }
        
        #pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 15;
            color: white;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="game-ui">
        <div id="score-board">分數: 0</div>
        <div id="timer-board">時間: 60</div>
        <div id="target-display">
            接住: <span id="current-target-char" style="color:#e74c3c; font-size:1.5em; font-weight:bold;">?</span>
            <div id="level-progress">進度: 0/5</div>
        </div>
        <div id="pause-btn" onclick="Game.togglePause()">||</div>
        <div id="pause-overlay" class="hidden">暫停中</div>
        <div id="toast-message">下一關！</div>
    </div>

    <!-- Main Menu -->
    <div id="start-screen" class="ui-screen">
        <h1>皮卡丘<br>文字接接樂</h1>
        <button class="btn btn-primary" onclick="Game.showTeacherPanel()">我是老師 (設定題目)</button>
        <button class="btn btn-secondary" onclick="Game.start()">開始遊戲</button>
        <div class="mobile-hint">移動皮卡丘接住正確的字！<br>電腦：左右方向鍵 / 手機：按住螢幕移動</div>
    </div>

    <!-- Student Ready Screen (Skipped menu) -->
    <div id="student-screen" class="ui-screen hidden">
        <h1>準備開始</h1>
        <p style="font-size: 1.2rem; margin-bottom: 20px;">老師已經設定好題目囉！</p>
        <button class="btn btn-primary" style="font-size: 1.5rem; padding: 20px 50px;" onclick="Game.start()">點擊開始遊戲</button>
    </div>

    <!-- Teacher Panel -->
    <div id="teacher-screen" class="ui-screen hidden">
        <div class="panel">
            <h2>題目與設定</h2>
            
            <div style="margin-bottom: 15px; text-align: left; padding: 0 10px;">
                <label for="time-input">遊戲時間 (秒)：</label>
                <input type="number" id="time-input" value="60" min="10" max="300">
            </div>

            <p style="font-size: 0.9rem; color: #666; margin-bottom: 10px;">請輸入要練習的文字 (可一次輸入多個字)。</p>
            <textarea id="target-input" placeholder="例如：愛我人日月星" oninput="Game.updateDistractorsPreview()">愛我人</textarea>
            
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 10px;">AI 將自動為每個字尋找相似/易混淆字。</p>
            
            <div id="distractor-container" class="distractor-preview">
                <!-- Preview generated chars here -->
            </div>

            <button class="btn btn-primary" onclick="Game.saveSettings()">直接開始</button>
            <button class="btn btn-green" onclick="Game.generateShareLink()">產生分享 QR Code</button>
            
            <div id="share-section">
                <p style="font-size: 0.9rem; color: #666; margin-bottom: 10px;">讓學生掃描此 QR Code，<br>即可直接進入遊戲！</p>
                <img id="qr-code-img" alt="QR Code" src="">
                <input type="text" id="share-link-box" readonly onclick="this.select()">
            </div>
            
            <button class="btn btn-secondary" style="margin-top:10px; font-size:1rem; padding:10px 20px;" onclick="Game.showMenu()">返回主選單</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="ui-screen hidden">
        <h1>遊戲結束</h1>
        <h2 id="final-score">得分: 0</h2>
        <button class="btn btn-primary" onclick="Game.start()">再玩一次</button>
        <button class="btn btn-secondary" onclick="Game.showMenu()">回主選單</button>
    </div>
</div>

<script>
/**
 * 升級版「易混淆字」資料庫 - 更相似，更具挑戰性
 */
const CONFUSING_DB = {
    '人': ['入', '八', '乂', '大', '个'],
    '大': ['太', '犬', '夫', '天', '人', '夭'],
    '天': ['夫', '大', '太', '夭', '未', '末'],
    '土': ['士', '工', '上', '止', '干'],
    '士': ['土', '工', '上', '壬', '王'],
    '王': ['玉', '主', '土', '干', '五', '壬'],
    '田': ['由', '甲', '申', '旦', '日', '目'],
    '日': ['曰', '目', '田', '白', '旦', '口'],
    '白': ['自', '百', '日', '臼', '伯', '的'],
    '木': ['本', '禾', '术', '林', '未', '末'],
    '本': ['木', '禾', '术', '体', '来'],
    '我': ['找', '錢', '淺', '俄', '娥', '戔'],
    '找': ['我', '划', '戏', '伐', '栈'],
    '愛': ['受', '暖', '憂', '慶', '曼'],
    '右': ['石', '左', '古', '若', '友'],
    '左': ['右', '在', '友', '存', '工'],
    '名': ['各', '多', '召', '呂', '句'],
    '午': ['牛', '干', '千', '乍', '年'],
    '牛': ['午', '半', '手', '生', '车'],
    '手': ['毛', '牛', '乎', '于', '才'],
    '水': ['氷', '永', '木', '火', '求'],
    '鳥': ['烏', '馬', '島', '焉', '梟'],
    '烏': ['鳥', '馬', '焉', '黑', '嗚'],
    '未': ['末', '木', '禾', '朱'],
    '末': ['未', '木', '禾', '朱'],
    '很': ['根', '銀', '狠', '恨'],
    '根': ['很', '銀', '狠', '恨'],
    '瓜': ['爪', '爬', '抓'],
    '爪': ['瓜', '爬', '抓'],
    '友': ['反', '支', '皮', '又']
};

const COMMON_CHARS = "的一是在不了有和人這中大為上個國我向要他時來用們生到作地於出就分對成會可主發年動同工也能下過子說產種面而方後多定行學法所民得經十三之進著等部度家更完樣今育提求治以流現五內聖";

const Game = {
    canvas: document.getElementById('gameCanvas'),
    ctx: null,
    width: 0,
    height: 0,
    state: 'start', 
    paused: false,
    score: 0,
    
    // Timer
    gameDuration: 60,
    remainingTime: 60,
    lastTime: 0,

    // Level System
    targetList: ['愛', '我', '人'],
    currentTargetIndex: 0,
    targetChar: '愛',
    distractors: [],
    levelProgress: 0,
    HITS_TO_ADVANCE: 5,
    
    // Game Entities
    player: { x: 0, y: 0, width: 64, height: 64, speed: 7, shockTimer: 0 },
    enemies: [],
    particles: [],
    
    // Input
    keys: { ArrowLeft: false, ArrowRight: false },
    touchX: null,
    
    // Settings
    frame: 0,
    gameSpeed: 2,

    init() {
        this.ctx = this.canvas.getContext('2d');
        // Disable interpolation for pixel art look
        this.ctx.imageSmoothingEnabled = false;
        
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') this.togglePause();
            this.keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => this.keys[e.key] = false);
        
        this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.playSound('silent');
        }, {passive: false});

        this.canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = this.canvas.getBoundingClientRect();
            const touch = e.touches[0];
            let targetX = touch.clientX - rect.left - this.player.width / 2;
            this.player.x = targetX;
            if (this.player.x < 0) this.player.x = 0;
            if (this.player.x > this.width - this.player.width) this.player.x = this.width - this.player.width;
        }, {passive: false});
        
        // Load config from URL first
        const isShared = this.checkURLParams();
        
        this.updateDistractorsPreview();
        
        // If it's a shared link, go to Student Screen, otherwise Main Menu
        if (isShared) {
            this.showStudentScreen();
        } else {
            this.showMenu();
        }
        
        this.loop(0);
    },
    
    checkURLParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const sharedWords = urlParams.get('words');
        const sharedTime = urlParams.get('time');
        
        let configFound = false;
        
        if (sharedWords) {
            try {
                const decoded = decodeURIComponent(sharedWords);
                if (decoded.length > 0) {
                    this.targetList = decoded.split('');
                    configFound = true;
                }
            } catch(e) {
                console.error("Error parsing words", e);
            }
        }
        
        if (sharedTime) {
            const t = parseInt(sharedTime);
            if (!isNaN(t) && t > 0) {
                this.gameDuration = t;
            }
        }
        
        // Sync UI
        document.getElementById('target-input').value = this.targetList.join('');
        document.getElementById('time-input').value = this.gameDuration;
        
        return configFound;
    },

    resize() {
        this.width = Math.min(window.innerWidth, 600); 
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        this.ctx.imageSmoothingEnabled = false; // Keep pixel art sharp on resize
        if (this.player) {
            this.player.y = this.height - 100;
            this.player.x = this.width / 2 - this.player.width / 2;
        }
    },

    generateDistractors(target) {
        let similar = CONFUSING_DB[target];
        let result = [];
        if (similar) result = [...similar];
        // Ensure we have enough distractors from DB if possible, or fill with random
        while (result.length < 5) {
            // Prefer confusing chars from other entries if DB is small for this char
            const keys = Object.keys(CONFUSING_DB);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            const randomConfusing = CONFUSING_DB[randomKey][0];
            
            let charToAdd = randomConfusing;
            // Fallback to completely random common char
            if (Math.random() > 0.5) {
                charToAdd = COMMON_CHARS[Math.floor(Math.random() * COMMON_CHARS.length)];
            }

            if (charToAdd !== target && !result.includes(charToAdd)) {
                result.push(charToAdd);
            }
        }
        return result.slice(0, 5);
    },

    showMenu() {
        this.state = 'start';
        this.toggleUIScreens('start-screen');
    },
    
    showStudentScreen() {
        this.state = 'start';
        this.toggleUIScreens('student-screen');
    },

    showTeacherPanel() {
        this.state = 'setup';
        this.toggleUIScreens('teacher-screen');
        document.getElementById('share-section').style.display = 'none';
        this.updateDistractorsPreview();
    },
    
    toggleUIScreens(activeId) {
        const screens = ['start-screen', 'student-screen', 'teacher-screen', 'game-over-screen'];
        screens.forEach(id => {
            const el = document.getElementById(id);
            if (id === activeId) el.classList.remove('hidden');
            else el.classList.add('hidden');
        });
        document.getElementById('toast-message').classList.remove('toast-visible');
        document.getElementById('pause-overlay').classList.add('hidden');
        document.getElementById('pause-btn').style.display = (activeId === '') ? 'flex' : 'none'; // Only show in game
    },
    
    generateShareLink() {
        const input = document.getElementById('target-input').value.trim();
        const timeInput = parseInt(document.getElementById('time-input').value);
        
        if (!input || input.length === 0) {
            alert("請先輸入題目文字！");
            return;
        }
        
        const cleanInput = input.replace(/\s/g, '');
        const baseUrl = window.location.href.split('?')[0];
        const newUrl = `${baseUrl}?words=${encodeURIComponent(cleanInput)}&time=${timeInput}`;
        
        const shareSection = document.getElementById('share-section');
        const qrImg = document.getElementById('qr-code-img');
        const linkBox = document.getElementById('share-link-box');
        
        shareSection.style.display = 'block';
        linkBox.value = newUrl;
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(newUrl)}`;
        
        const panel = document.querySelector('.panel');
        setTimeout(() => { panel.scrollTop = panel.scrollHeight; }, 100);
    },

    updateDistractorsPreview() {
        const input = document.getElementById('target-input').value.replace(/\s/g, ''); 
        const container = document.getElementById('distractor-container');
        if (!input) {
            container.innerHTML = '請輸入文字';
            return;
        }
        
        let html = '<div style="font-size:0.8rem; width:100%; margin-bottom:5px;">預覽目標字列表:</div>';
        const chars = input.split('').filter((item, pos, self) => self.indexOf(item) == pos);
        chars.forEach(c => {
            html += `<span class="target-tag">${c}</span>`;
        });
        container.innerHTML = html;
    },

    saveSettings() {
        const input = document.getElementById('target-input').value.trim();
        const timeInput = parseInt(document.getElementById('time-input').value);
        
        if (input && input.length > 0 && !isNaN(timeInput) && timeInput > 0) {
            const cleanInput = input.replace(/\s/g, '');
            this.targetList = cleanInput.split('');
            this.gameDuration = timeInput;
            this.start();
        } else {
            alert("請輸入有效的文字與時間");
        }
    },

    setCurrentTarget(char) {
        this.targetChar = char;
        this.distractors = this.generateDistractors(char);
        document.getElementById('current-target-char').innerText = this.targetChar;
        document.getElementById('level-progress').innerText = `進度: ${this.levelProgress}/${this.HITS_TO_ADVANCE}`;
    },
    
    togglePause() {
        if (this.state !== 'playing') return;
        this.paused = !this.paused;
        const pauseBtn = document.getElementById('pause-btn');
        const pauseOverlay = document.getElementById('pause-overlay');
        
        if (this.paused) {
            pauseBtn.innerText = "▶";
            pauseBtn.style.background = "#2ecc71"; // Green for play
            pauseOverlay.classList.remove('hidden');
        } else {
            pauseBtn.innerText = "||";
            pauseBtn.style.background = "#e74c3c"; // Red for pause
            pauseOverlay.classList.add('hidden');
        }
    },

    start() {
        this.score = 0;
        this.frame = 0;
        this.gameSpeed = 3; 
        this.remainingTime = this.gameDuration;
        this.enemies = [];
        this.particles = [];
        this.paused = false;
        this.player.shockTimer = 0;
        
        // Reset Pause UI
        document.getElementById('pause-btn').innerText = "||";
        document.getElementById('pause-btn').style.background = "#e74c3c";
        document.getElementById('pause-overlay').classList.add('hidden');
        
        this.resize(); 
        
        // Ensure target list exists
        if (this.targetList.length === 0) {
            this.targetList = ['愛', '我', '人']; 
        }
        
        // Level Init
        this.currentTargetIndex = 0;
        this.levelProgress = 0;
        this.setCurrentTarget(this.targetList[0]);

        document.getElementById('score-board').innerText = "分數: 0";
        document.getElementById('timer-board').innerText = "時間: " + this.remainingTime;
        
        this.toggleUIScreens(''); // Hide all screens
        document.getElementById('pause-btn').style.display = 'flex'; // Show pause btn
        
        this.lastTime = performance.now();
        this.state = 'playing';
        
        this.playSound('silent'); // Unlock audio
    },

    gameOver() {
        this.state = 'gameover';
        document.getElementById('final-score').innerText = "得分: " + this.score;
        this.toggleUIScreens('game-over-screen');
    },

    levelUp() {
        const toast = document.getElementById('toast-message');
        toast.innerText = "下一關！換字囉！";
        toast.classList.add('toast-visible');
        setTimeout(() => {
            toast.classList.remove('toast-visible');
        }, 1500);

        this.playSound('levelup');

        this.currentTargetIndex++;
        if (this.currentTargetIndex >= this.targetList.length) {
            this.currentTargetIndex = 0; 
        }
        this.levelProgress = 0;
        this.setCurrentTarget(this.targetList[this.currentTargetIndex]);
        
        this.enemies.forEach(e => {
             this.createParticles(e.x + e.width/2, e.y + e.height/2, '#fff');
        });
        this.enemies = []; 
    },

    spawnEnemy() {
        const x = Math.random() * (this.width - 50);
        const isCorrect = Math.random() > 0.6; 
        
        let char = this.targetChar;
        if (!isCorrect) {
            char = this.distractors[Math.floor(Math.random() * this.distractors.length)];
        }

        this.enemies.push({
            x: x,
            y: -50,
            width: 50, 
            height: 50,
            char: char,
            isCorrect: isCorrect,
            speed: Math.random() * 2 + this.gameSpeed
        });
    },

    createParticles(x, y, color) {
        for(let i=0; i<10; i++) {
            this.particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 40,
                color: color
            });
        }
    },
    
    triggerShock() {
        this.player.shockTimer = 30; // 30 frames of shock
    },

    checkCollision(rect1, rect2) {
        return (rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y);
    },

    speak(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW'; // Set language to Traditional Chinese
            utterance.rate = 1; // Normal speed
            window.speechSynthesis.cancel(); // Cancel previous speech to avoid queue buildup
            window.speechSynthesis.speak(utterance);
        }
    },

    update(timestamp) {
        if (this.state !== 'playing' || this.paused) {
            this.lastTime = timestamp; // Prevent time jump
            return;
        }

        const deltaTime = timestamp - this.lastTime;
        if (deltaTime >= 1000) {
            this.remainingTime--;
            document.getElementById('timer-board').innerText = "時間: " + this.remainingTime;
            this.lastTime = timestamp;
            if (this.remainingTime <= 0) {
                this.gameOver();
                return;
            }
        }

        this.frame++;
        
        // Update Shock Timer
        if (this.player.shockTimer > 0) this.player.shockTimer--;

        if (this.frame % 600 === 0) {
            this.gameSpeed += 0.2;
        }

        if (this.frame % Math.floor(60 / (this.gameSpeed * 0.4)) === 0) {
            this.spawnEnemy();
        }

        if (this.keys.ArrowLeft && this.player.x > 0) this.player.x -= this.player.speed;
        if (this.keys.ArrowRight && this.player.x < this.width - this.player.width) this.player.x += this.player.speed;

        const playerHitbox = {
            x: this.player.x + 10,
            y: this.player.y + 10,
            width: this.player.width - 20,
            height: this.player.height - 20
        };

        let levelUpTriggered = false;

        for (let i = this.enemies.length - 1; i >= 0; i--) {
            let e = this.enemies[i];
            
            if (!e) continue;

            e.y += e.speed;

            if (this.checkCollision(playerHitbox, e)) {
                this.enemies.splice(i, 1);
                
                if (e.isCorrect) {
                    this.score += 10;
                    this.levelProgress++;
                    this.createParticles(e.x + e.width/2, e.y + e.height/2, '#f1c40f');
                    this.playSound('catch_good');
                    this.speak(e.char); // Speak the character
                    
                    if (this.levelProgress >= this.HITS_TO_ADVANCE) {
                        this.levelUp();
                        levelUpTriggered = true;
                    } else {
                        document.getElementById('level-progress').innerText = `進度: ${this.levelProgress}/${this.HITS_TO_ADVANCE}`;
                    }
                } else {
                    this.score -= 5;
                    this.createParticles(e.x + e.width/2, e.y + e.height/2, '#e74c3c');
                    this.playSound('catch_bad');
                    this.triggerShock(); // Trigger shock animation
                }
                document.getElementById('score-board').innerText = "分數: " + this.score;
                
                if (levelUpTriggered) break; 
                continue; 
            }

            if (e.y > this.height) {
                if (i < this.enemies.length && this.enemies[i] === e) {
                   this.enemies.splice(i, 1);
                }
            }
        }
        
        if (levelUpTriggered) return;

        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            if (p.life <= 0) this.particles.splice(i, 1);
        }
    },
    
    // Draw Pixel Pikachu
    drawPixelPikachu(x, y, w, h) {
        // Simple Pixel Grid (1 = Yellow, 2 = Black, 3 = Red, 4 = Brown, 5 = White)
        // 16x16 grid approximation
        const px = w / 16;
        const py = h / 16;
        
        // Draw Ears (Left/Right)
        this.ctx.fillStyle = '#000'; // Black tips
        this.ctx.fillRect(x + 1*px, y + 0*px, 2*px, 2*px);
        this.ctx.fillRect(x + 13*px, y + 0*px, 2*px, 2*px);
        
        this.ctx.fillStyle = '#F1C40F'; // Yellow Body/Ears
        this.ctx.fillRect(x + 2*px, y + 2*px, 2*px, 3*px); // L Ear
        this.ctx.fillRect(x + 12*px, y + 2*px, 2*px, 3*px); // R Ear
        
        // Head Main
        this.ctx.fillRect(x + 3*px, y + 4*px, 10*px, 8*px);
        this.ctx.fillRect(x + 2*px, y + 6*px, 12*px, 5*px); // Widen face
        
        // Eyes
        this.ctx.fillStyle = '#000';
        this.ctx.fillRect(x + 4*px, y + 6*px, 2*px, 2*px);
        this.ctx.fillRect(x + 10*px, y + 6*px, 2*px, 2*px);
        // Eye Sparkle
        this.ctx.fillStyle = '#FFF';
        this.ctx.fillRect(x + 5*px, y + 6.2*px, 0.5*px, 0.5*px);
        this.ctx.fillRect(x + 11*px, y + 6.2*px, 0.5*px, 0.5*px);
        
        // Cheeks (Red)
        this.ctx.fillStyle = '#E74C3C';
        this.ctx.fillRect(x + 2*px, y + 8*px, 2*px, 2*px);
        this.ctx.fillRect(x + 12*px, y + 8*px, 2*px, 2*px);
        
        // Nose
        this.ctx.fillStyle = '#000';
        this.ctx.fillRect(x + 7.5*px, y + 8.5*px, 1*px, 0.5*px);
        
        // Mouth
        this.ctx.beginPath();
        this.ctx.strokeStyle = '#000';
        this.ctx.lineWidth = 2;
        this.ctx.moveTo(x + 7*px, y + 9.5*px);
        this.ctx.lineTo(x + 8*px, y + 10*px);
        this.ctx.lineTo(x + 9*px, y + 9.5*px);
        this.ctx.stroke();
        
        // Body
        this.ctx.fillStyle = '#F1C40F';
        this.ctx.fillRect(x + 4*px, y + 11*px, 8*px, 5*px);
        
        // Tail
        this.ctx.fillStyle = '#8B4513'; // Brown base
        this.ctx.fillRect(x + 4*px, y + 12*px, 2*px, 1*px);
        this.ctx.fillStyle = '#F1C40F'; // Yellow lightning
        this.ctx.fillRect(x + 1*px, y + 7*px, 2*px, 1*px);
        this.ctx.fillRect(x + 2*px, y + 8*px, 1*px, 2*px);
        this.ctx.fillRect(x + 3*px, y + 10*px, 1*px, 2*px);
        
        // Shock Effect Overlay
        if (this.player.shockTimer > 0) {
            this.ctx.strokeStyle = (Math.floor(this.frame / 2) % 2 === 0) ? '#FFFF00' : '#87CEEB';
            this.ctx.lineWidth = 3;
            this.ctx.beginPath();
            // Jagged lines
            for (let i = 0; i < 8; i++) {
                let angle = (i / 8) * Math.PI * 2;
                let r = w/1.5 + Math.random() * 10;
                let sx = x + w/2 + Math.cos(angle) * r;
                let sy = y + h/2 + Math.sin(angle) * r;
                if (i===0) this.ctx.moveTo(sx, sy);
                else this.ctx.lineTo(sx, sy);
            }
            this.ctx.closePath();
            this.ctx.stroke();
        }
    },

    draw() {
        this.ctx.clearRect(0, 0, this.width, this.height);

        if (this.state !== 'playing') return;

        // Draw Player (Pixel Art)
        this.drawPixelPikachu(this.player.x, this.player.y, this.player.width, this.player.height);

        // Enemies (Falling bubbles)
        this.enemies.forEach(e => {
            // Shadow
            this.ctx.fillStyle = 'rgba(0,0,0,0.1)';
            this.ctx.beginPath();
            this.ctx.arc(e.x + e.width/2 + 3, e.y + e.height/2 + 3, e.width/2, 0, Math.PI*2);
            this.ctx.fill();

            // Bubble
            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            this.ctx.beginPath();
            this.ctx.arc(e.x + e.width/2, e.y + e.height/2, e.width/2, 0, Math.PI*2);
            this.ctx.fill();
            
            // Border
            this.ctx.strokeStyle = '#3498db';
            this.ctx.lineWidth = 2;
            this.ctx.stroke();

            // Text
            this.ctx.fillStyle = '#2c3e50';
            this.ctx.font = 'bold 28px "BiauKai", "標楷體", serif';
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.fillText(e.char, e.x + e.width/2, e.y + e.height/2);
        });

        // Particles
        this.particles.forEach(p => {
            this.ctx.fillStyle = p.color;
            this.ctx.fillRect(p.x, p.y, 5, 5);
        });
    },

    loop(timestamp) {
        this.update(timestamp);
        this.draw();
        requestAnimationFrame((ts) => this.loop(ts));
    },
    
    playSound(type) {
        if (!window.AudioContext && !window.webkitAudioContext) return;
        
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!this.audioCtx) this.audioCtx = new AudioContext();

        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.connect(gain);
        gain.connect(this.audioCtx.destination);

        const now = this.audioCtx.currentTime;
        
        if (type === 'catch_good') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'catch_bad') {
            // Electric buzz sound
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'levelup') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            osc.frequency.setValueAtTime(1000, now + 0.2);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.1, now + 0.3);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'silent') {
            osc.frequency.setValueAtTime(0, now);
            gain.gain.setValueAtTime(0, now);
            osc.start(now);
            osc.stop(now + 0.01);
        }
    }
};

window.onload = () => Game.init();
</script>
